# Keyboard name shown to USB and Bluetooth hosts (max. 16 characters).
CONFIG_ZMK_KEYBOARD_NAME="Piantor Pro BT"

# --- 电源 / 休眠 ---
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# --- 显示 ---
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# --- RGB ---
# 编译期整个砍掉：灯带是朝下的 underglow，配不透光键帽等于完全看不见，
# 而它是无线分体上最大的耗电项。
# 注意：改回 y 之后 FUN 层的 &ext_power 键仍然有效，但要重新加 &rgb_ug 绑定。
CONFIG_ZMK_RGB_UNDERGLOW=n

# --- 深度关机 ---
# 不启用。本板未定义 zmk,soft-off-wakeup-sources，而 ZMK 在进入 soft-off 时会
# 主动取消 kscan 的唤醒资格（见 app/src/pm.c），结果是关机后无法用按键唤醒。
# 出差装包直接用板子上的物理电源拨钮。
# CONFIG_ZMK_PM_SOFT_OFF=y

# --- Seniply 相关 ---
# 本方案不使用 home row mods，所以不需要任何 mod-tap 调参
# （require-prior-idle-ms / tapping-term 等在这里完全用不上）。
# 双拼打快时不会有任何误触发风险。

# --- 可选：鼠标键 ---
# 目前不需要（继续用鼠标）。将来想加鼠标层，取消下面两行注释即可，
# 然后在 gallium_seniply.dtsi 里用 &mmv / &mkp / &msc。
# CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- 可选：BIOS / UEFI 兼容 ---
# CONFIG_ZMK_USB_BOOT=y
