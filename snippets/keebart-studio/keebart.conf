CONFIG_ZMK_STUDIO=n
CONFIG_KEEBART_STUDIO=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_HID_INTERRUPT_EP_MPS=32
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_USB_DEVICE_VID=0xfeed
CONFIG_USB_DEVICE_PID=0x0304
CONFIG_USB_DEVICE_MANUFACTURER="Keebart"
CONFIG_USB_DEVICE_PRODUCT="Corne Choc Pro BT"
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

CONFIG_ZMK_POINTING=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Battery reporting and GATT service-changed notifications.
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

# Radio-friendly flash erase and assertion overhead reductions.
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_TICKER=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=2
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_BT_ASSERT_VERBOSE=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_BOOT_BANNER=n

# One encrypted ATT write carries a complete 30-LED frame.
CONFIG_BT_L2CAP_TX_MTU=100
CONFIG_BT_BUF_ACL_RX_SIZE=104
CONFIG_BT_BUF_ACL_TX_SIZE=104
# Disable LL Data Length Update (DLE): Zephyr 3.5 sets BT_QUIRK_NO_AUTO_DLE on nRF52840
# and triggers LL_LENGTH_REQ immediately on connect, colliding with Linux/Realtek pairing
# (0x24 LMP PDU Not Allowed). L2CAP MTU 100 still works over 27-byte LL fragments.
CONFIG_BT_DATA_LEN_UPDATE=n

# Use the entire 64 KiB central partition, including NVS garbage-collection headroom.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=128

# Persistent Bluetooth identity/bond storage is independent of Studio protocol changes.
CONFIG_SETTINGS_NVS_SECTOR_SIZE_MULT=1
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n

# User-visible name; immutable model identity stays in the Studio protocol.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=120
CONFIG_BT_DEVICE_NAME_GATT_WRITABLE=n
