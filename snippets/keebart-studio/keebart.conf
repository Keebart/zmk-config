CONFIG_ZMK_STUDIO=n
CONFIG_KEEBART_STUDIO=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_HID_INTERRUPT_EP_MPS=32
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_USB_DEVICE_VID=0xfeed
CONFIG_USB_DEVICE_PID=0x0304
CONFIG_USB_DEVICE_MANUFACTURER="Keebart"
CONFIG_USB_DEVICE_PRODUCT="Corne Choc Pro BT"
CONFIG_ZMK_HID_INDICATORS=y

CONFIG_ZMK_POINTING=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=4096

# One encrypted ATT write carries a complete 30-LED frame.
CONFIG_BT_L2CAP_TX_MTU=100
CONFIG_BT_BUF_ACL_RX_SIZE=104
CONFIG_BT_BUF_ACL_TX_SIZE=104

# Use the entire 64 KiB central partition, including NVS garbage-collection headroom.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=128

# Persistent Bluetooth identity/bond storage is independent of Studio protocol changes.
CONFIG_SETTINGS_NVS_SECTOR_SIZE_MULT=1
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n

# User-visible name; immutable model identity stays in the Studio protocol.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=120
CONFIG_BT_DEVICE_NAME_GATT_WRITABLE=n
