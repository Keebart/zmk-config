CONFIG_ZMK_STUDIO=n
CONFIG_KEEBART_STUDIO_PERIPHERAL=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

# Radio-friendly flash erase and assertion overhead reductions.
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_TICKER=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=2
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_BT_ASSERT_VERBOSE=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_BOOT_BANNER=n

# One encrypted ATT write carries a complete 30-LED frame.
CONFIG_BT_L2CAP_TX_MTU=100
CONFIG_BT_BUF_ACL_RX_SIZE=104
CONFIG_BT_BUF_ACL_TX_SIZE=104

# Stable peripheral NVS geometry: keep the existing split bond.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=8

# Persistent Bluetooth identity/bond storage is independent of Studio protocol changes.
CONFIG_SETTINGS_NVS_SECTOR_SIZE_MULT=1
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
