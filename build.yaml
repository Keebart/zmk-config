# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
  - board: corne_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: corne_choc_pro_right
    shield: nice_view
    snippet: studio-rpc-usb-uart

  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: corne_v1_left
    snippet: studio-rpc-usb-uart
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: corne_v1_right
    shield: nice_view
    snippet: studio-rpc-usb-uart

  - board: corne_v1_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_v1_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  # NumNav: same hardware as corne_v1, different layers (split SYMBOL /
  # NUMNAV instead of one combined NUM/SYM, plus bracket combos).
  - board: corne_v2_left
    snippet: studio-rpc-usb-uart
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: corne_v2_right
    shield: nice_view
    snippet: studio-rpc-usb-uart

  - board: corne_v2_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_v2_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: corne_choc_single_right_board
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  - board: corne_choc_single_right_board
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: corne_choc_single_left_board
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  - board: corne_choc_single_left_board
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  # --- Perpetual (48-key split, nice!nano v2) -------------------------------
  # A shield, not a board: perpetual_left/right sit on a nice_nano_v2.
  # NO display shield -- the PCB has no nice!view or OLED header. The CS/SCK/P8
  # nets terminate on the MCU jumper pads and go nowhere.
  # Studio flags mirror the corne targets above: the snippet on both halves so
  # Studio can reach the board over USB, and CONFIG_ZMK_STUDIO only on the
  # central side (left -- see Kconfig.defconfig in the shield).
  - board: nice_nano_v2
    shield: perpetual_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: perpetual_left
  - board: nice_nano_v2
    shield: perpetual_right
    snippet: studio-rpc-usb-uart
    artifact-name: perpetual_right

  - board: nice_nano_v2
    shield: settings_reset
    snippet: studio-rpc-usb-uart
    artifact-name: perpetual_settings_reset
