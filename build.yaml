# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
  - board: corne_choc_pro_left
    snippet: keebart-studio
    shield: sharp_mip
    artifact-name: corne_choc_pro_bt_keebart_left
  - board: corne_choc_pro_right
    snippet: keebart-studio-peripheral
    shield: sharp_mip
    artifact-name: corne_choc_pro_bt_keebart_right
  - board: corne_choc_pro_left
    snippet: keebart-studio
    artifact-name: corne_choc_pro_bt_keebart_left_nodisplay
  - board: corne_choc_pro_right
    snippet: keebart-studio-peripheral
    artifact-name: corne_choc_pro_bt_keebart_right_nodisplay

  - board: corne_choc_pro_5col_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_bt_5col_left
  - board: corne_choc_pro_5col_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_5col_right

  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: piantor_pro_bt_left
    snippet: keebart-studio-piantor-bt
    shield: sharp_mip
    artifact-name: piantor_pro_bt_keebart_left

  - board: piantor_pro_bt_right
    snippet: keebart-studio-peripheral
    shield: sharp_mip
    artifact-name: piantor_pro_bt_keebart_right
  - board: piantor_pro_bt_left
    snippet: keebart-studio-piantor-bt
    artifact-name: piantor_pro_bt_keebart_left_nodisplay
  - board: piantor_pro_bt_right
    snippet: keebart-studio-peripheral
    artifact-name: piantor_pro_bt_keebart_right_nodisplay

  - board: piantor_pro_bt_5col_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: piantor_pro_bt_5col_left
  - board: piantor_pro_bt_5col_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: piantor_pro_bt_5col_right

  - board: piantor_pro_bt_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: piantor_pro_bt_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: sofle_choc_pro_left
    snippet: keebart-studio-sofle-bt
    shield: sharp_mip
    artifact-name: sofle_choc_pro_bt_keebart_left

  - board: sofle_choc_pro_right
    snippet: keebart-studio-peripheral
    shield: sharp_mip
    artifact-name: sofle_choc_pro_bt_keebart_right
  - board: sofle_choc_pro_left
    snippet: keebart-studio-sofle-bt
    artifact-name: sofle_choc_pro_bt_keebart_left_nodisplay
  - board: sofle_choc_pro_right
    snippet: keebart-studio-peripheral
    artifact-name: sofle_choc_pro_bt_keebart_right_nodisplay

  - board: sofle_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: sofle_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart
